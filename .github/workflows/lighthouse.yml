name: Lighthouse

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.32.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - name: Run Lighthouse (desktop)
        run: pnpm --filter @unsaid/web run lighthouse
        env:
          PUBLIC_API_URL: ${{ secrets.PUBLIC_API_URL || 'https://api.unsaid.santi020k.com' }}
          PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA

      - name: Run Lighthouse (mobile)
        run: pnpm --filter @unsaid/web run lighthouse:mobile
        env:
          PUBLIC_API_URL: ${{ secrets.PUBLIC_API_URL || 'https://api.unsaid.santi020k.com' }}
          PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: lighthouse-reports
          path: |
            apps/web/.lighthouseci/
            apps/web/.lighthouseci-mobile/
          retention-days: 7
